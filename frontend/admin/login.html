<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Yeaty-Store.gh</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'yeaty-yellow': '#FDB813',
                        'yeaty-blue': '#0066CC',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-yeaty-blue to-blue-800 min-h-screen flex items-center justify-center">
    
    <div class="container mx-auto px-4">
        <div class="max-w-md mx-auto">
            <!-- Logo -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-white mb-2">
                    <span class="text-yeaty-yellow">Yeaty</span><span class="text-white">Store</span><span class="text-gray-200">.gh</span>
                </h1>
                <p class="text-gray-200">Admin Panel</p>
            </div>

            <!-- Login Card -->
            <div class="bg-white rounded-2xl shadow-2xl p-8">
                <div class="text-center mb-8">
                    <div class="inline-block p-4 bg-yeaty-blue rounded-full mb-4">
                        <i class="fas fa-user-shield text-3xl text-white"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800">Admin Login</h2>
                    <p class="text-gray-600 mt-2">Enter your credentials to access the dashboard</p>
                </div>

                <!-- Alert Messages -->
                <div id="alertMessage" class="hidden mb-4 p-4 rounded-lg"></div>

                <!-- Login Form -->
                <form id="loginForm">
                    <div class="mb-6">
                        <label class="block text-gray-700 font-semibold mb-2">
                            <i class="fas fa-envelope mr-2"></i>Email Address
                        </label>
                        <input type="email" 
                               id="email" 
                               required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yeaty-blue focus:border-transparent"
                               placeholder="admin@yeaty-store.gh">
                    </div>

                    <div class="mb-6">
                        <label class="block text-gray-700 font-semibold mb-2">
                            <i class="fas fa-lock mr-2"></i>Password
                        </label>
                        <div class="relative">
                            <input type="password" 
                                   id="password" 
                                   required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yeaty-blue focus:border-transparent"
                                   placeholder="Enter your password">
                            <button type="button" 
                                    id="togglePassword" 
                                    class="absolute right-3 top-3.5 text-gray-500 hover:text-gray-700">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-6 flex items-center justify-between">
                        <label class="flex items-center">
                            <input type="checkbox" class="mr-2 rounded">
                            <span class="text-sm text-gray-600">Remember me</span>
                        </label>
                        <a href="#" class="text-sm text-yeaty-blue hover:underline">Forgot Password?</a>
                    </div>

                    <button type="submit" 
                            id="submitBtn"
                            class="w-full bg-yeaty-blue text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-all transform hover:scale-105">
                        <i class="fas fa-sign-in-alt mr-2"></i>Login to Dashboard
                    </button>
                </form>

                <!-- Back to Store -->
                <div class="mt-6 text-center">
                    <a href="../index.html" class="text-gray-600 hover:text-yeaty-blue transition">
                        <i class="fas fa-arrow-left mr-2"></i>Back to Store
                    </a>
                </div>
            </div>

            <!-- Test Credentials Info -->
            <div class="mt-6 bg-white/10 backdrop-blur-sm rounded-lg p-4 text-white text-sm">
                <p class="font-semibold mb-2"><i class="fas fa-info-circle mr-2"></i>Test Credentials:</p>
                <p>Email: admin@yeaty-store.gh</p>
                <p>Password: Admin123!</p>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Show alert message function (used by login.js)
        function showAlert(message, type = 'error') {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.className = `mb-4 p-4 rounded-lg ${
                type === 'success' ? 'bg-green-100 text-green-700 border border-green-400' : 
                'bg-red-100 text-red-700 border border-red-400'
            }`;
            alertDiv.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} mr-2"></i>
                ${message}
            `;
            alertDiv.classList.remove('hidden');

            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.classList.add('hidden');
                }, 2000);
            }
        }

        // Check if already logged in (redirect if already authenticated)
        if (localStorage.getItem('token')) {
            window.location.href = 'dashboard.html';
        }
    </script>
    
    <!-- External login script handles form submission -->
    <script src="js/login.js"></script>
</body>
</html>
